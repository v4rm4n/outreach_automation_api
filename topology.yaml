# - outreach_automation_api/topology.yaml -

exchanges:
  - name: "outreach.delayed"
    kind: "x-delayed-message"
    arguments:
      x-delayed-type: "direct"
  # DLX
  - name: "outreach.dlx"
    kind: "direct"

queues:
  - name: "dispatch_jobs"
    queue_type: "classic"
  # Dead Letter Queue
  - name: "dead_letters"
    queue_type: "classic"

bindings:
  - source: "outreach.delayed"
    destination: "dispatch_jobs"
    destination_type: "queue"
    routing_key: "campaign.dispatch"
  # Bind DLQ to DLX
  - source: "outreach.dlx"
    destination: "dead_letters"
    destination_type: "queue"
    routing_key: "dispatch.failed"