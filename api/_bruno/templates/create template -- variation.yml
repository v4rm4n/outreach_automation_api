info:
  name: create template -- variation
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/templates"
  body:
    type: json
    data: |-
      {
        "name": "Winter Met Gala 2026",
        "body": "Hi {{full_name}},\n\nI had a look at your posts and stories! Your content on @{{handle}} has serious potential to represent our bran in the upcoming Winter Met Gala.\n\n. Let me know if you are open to collaborating!\n\nBest,\nThe ChillGel Team"
      }
  auth:
    type: bearer
    token: "{{auth_tok}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
