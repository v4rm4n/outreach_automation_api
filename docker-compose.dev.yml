# - outreach_automation_api/docker-compose.dev.yml -

services:
  mongo:
    image: mongo:7
    container_name: outreach_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: outreach_automation

  redis:
    image: redis:7-alpine
    container_name: outreach_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    build: 
      context: .
      dockerfile: Dockerfile.rabbitmq
    container_name: outreach_rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  mongo_data:
  redis_data:
  rabbit_data: